<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1B2E">
    <meta name="description" content="ADHD Focus Dashboard - A productivity tool designed for the ADHD brain">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>ADHD Focus Dashboard</title>
  </head>
  <body class="font-sans antialiased text-gray-900 dark:text-gray-100 bg-cream dark:bg-navy">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
              // Disable SW in development/localhost to avoid caching issues during debugging
              if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                  navigator.serviceWorker.getRegistrations().then(registrations => {
                      for (let registration of registrations) {
                          registration.unregister();
                          console.log('SW unregistered for development');
                      }
                  });
              } else {
                  navigator.serviceWorker.register('/sw.js')
                      .then((registration) => {
                          console.log('SW registered:', registration.scope);
                      })
                      .catch((error) => {
                          console.log('SW registration failed:', error);
                      });
              }
          });
      }
      if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
      }
    </script>
    <!-- Audio Placeholder -->
    <audio id="notification-sound" preload="auto">
        <!-- <source src="/sounds/gentle-bell.mp3" type="audio/mpeg"> -->
    </audio>
  </body>
</html>
